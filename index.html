<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>기업 Informer</title>
<meta name="apple-mobile-web-app-title" content="기업 Informer">
<style>
  :root{
    --bg:#f4f6fa;--card:#fff;--ink:#1b2430;--sub:#6b7686;--line:#e3e8ef;
    --accent:#1f3a5f;--accent2:#2f6fed;--new:#e5484d;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--sub:#93a0b1;--line:#2a3441;--accent:#7aa7ff;--accent2:#7aa7ff;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px 10px}
  h1{font-size:18px;margin:0 0 10px}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
  button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;background:var(--accent2);color:#fff}
  button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:5px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);border:1px solid var(--line);white-space:nowrap}
  .tab.on{color:var(--accent2);border-color:var(--accent2);font-weight:700}
  .chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  @media (prefers-color-scheme:dark){.chip.on{color:#10151c}}
  .chip .x{opacity:.6;font-size:12px;padding:0 2px}
  .badge{background:var(--new);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
  .tools{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--sub);flex-wrap:wrap}
  select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
  .item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:inherit}
  .item:hover{border-color:var(--accent2)}
  .item .t{font-weight:600;font-size:15px}
  .item .m{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .item .co{color:var(--accent2);font-weight:600}
  .sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .sumh{font-weight:700;font-size:15px;margin-bottom:10px}
  .sumh span{font-weight:400;font-size:12px;color:var(--sub);margin-left:6px}
  .topic{padding:10px 0;border-top:1px solid var(--line)}
  .topic:first-of-type{border-top:0;padding-top:0}
  .tt{font-weight:700;font-size:14px;color:var(--accent2)}
  .tt .badge2{background:var(--bg);color:var(--sub);border-radius:999px;font-size:11px;padding:1px 8px;margin-left:4px;font-weight:500}
  .tl{display:block;margin-top:4px;font-size:14px;color:var(--ink);text-decoration:none}
  .tm{font-size:12px;color:var(--sub);margin-top:2px}
  .brief .bh{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
  .brief .bt{font-weight:700;font-size:18px;line-height:1.4}
  .brief .bt small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px}
  .brief .bd{margin-left:auto;max-width:56%;word-break:keep-all;text-wrap:balance;text-align:right;font-size:13.5px;line-height:1.55;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .brief ul{margin:0;padding-left:22px}
  .brief li{font-size:17px;line-height:1.85;margin-bottom:12px;letter-spacing:-0.01em;word-break:keep-all}
  .brief li:last-child{margin-bottom:0}
  .brief li b{color:var(--accent2);margin-right:6px}
  @media (max-width:560px){
    .brief .bd{max-width:100%;width:100%;text-align:left;margin-left:0}
    .brief li{font-size:16.5px}
  }
  #bar{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;opacity:0;transition:opacity .25s}
  #bar.on{opacity:1}
  #bar i{display:block;height:100%;width:0;background:var(--accent2);transition:width .4s ease}
  #bar.ind i{width:35%;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes rot{to{transform:rotate(360deg)}}
  button:disabled{opacity:.75;cursor:progress}
  .stat{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--card)}
  .stat small{flex-basis:100%;font-weight:400;font-size:12.5px;color:var(--sub);line-height:1.5}
  .stat.load{color:var(--accent2);border-color:var(--accent2)}
  .stat.ok{color:#1a8f4c;border-color:#1a8f4c}
  .stat.bad{color:var(--new);border-color:var(--new)}
  .stat button{margin-left:auto;padding:7px 12px;font-size:13px}
  .skel{height:76px;border-radius:12px;margin-bottom:10px;border:1px solid var(--line);background:linear-gradient(90deg,var(--card) 25%,var(--bg) 50%,var(--card) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}
  @keyframes shim{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.skel,.spin,#bar.ind i{animation-duration:3s}}
  .empty,.status{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}
  .err{color:var(--new)}
</style>
</head>
<body>
<header>
  <h1>📰 기업 Informer</h1>
  <div class="row">
    <input id="q" type="text" placeholder="기업 추가 (별칭: 한수원=한국수력원자력 OR 한수원)" enterkeyhint="search">
    <button id="add">추가</button>
  </div>
  <div class="chips" id="tabs"></div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <span>기간</span>
    <select id="period">
      <option value="1d">1일</option>
      <option value="7d" selected>7일</option>
      <option value="30d">30일</option>
    </select>
    <button class="ghost" id="refresh">새로고침</button>
    <button class="ghost" id="notify">알림 켜기</button>
    <span id="updated"></span>
  </div>
  <div id="bar"><i></i></div>
</header>
<main><section id="stat"></section><section id="brief"></section><section id="summary"></section><div id="list"></div></main>

<script>

function rssUrl(kw){
  const q = encodeURIComponent(aliasOf(kw) + ' when:' + $('#period').value);
  return `https://news.google.com/rss/search?q=${q}&hl=ko&gl=KR&ceid=KR:ko`;
}
const clean = t => t.replace(/ - [^-]+$/, '').trim();
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://thingproxy.freeboard.io/fetch/' + u
];
let goodProxy = 0;
async function withTimeout(url, ms){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try{ return await fetch(url, {signal: c.signal}); } finally { clearTimeout(t); }
}
function parseXml(text, kw){
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  if(xml.querySelector('parsererror')) return [];
  return [...xml.querySelectorAll('item')].map(i => {
    const t = i.querySelector('title')?.textContent || '';
    return {
      title: clean(t), link: i.querySelector('link')?.textContent || '',
      source: i.querySelector('source')?.textContent || (t.match(/ - ([^-]+)$/)||[])[1] || '',
      date: new Date(i.querySelector('pubDate')?.textContent || Date.now()), kw
    };
  });
}
async function viaRss2json(kw){
  const r = await withTimeout('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl(kw)), 8000);
  const j = await r.json();
  if(j.status !== 'ok') throw new Error('rss2json 실패');
  return j.items.map(i => ({
    title: clean(i.title), link: i.link,
    source: (i.title.match(/ - ([^-]+)$/)||[])[1] || '',
    date: new Date((i.pubDate||'').replace(' ','T') + 'Z'), kw
  }));
}

let ARTICLES = null, ARTICLES_AT = '';
async function loadArticles(){
  try{
    const r = await fetch('articles.json', {cache:'no-store'});
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.articles && Object.keys(j.articles).length){ ARTICLES = j.articles; ARTICLES_AT = j.updated || ''; }
  }catch(e){}
}
const DAYS = {'1d':1, '7d':7, '30d':30};
function fromServer(kw){
  if(!ARTICLES || custom[kw] || !ARTICLES[kw]) return null;
  const since = Date.now() - (DAYS[$('#period').value] || 30) * 86400000;
  return ARTICLES[kw]
    .filter(a => a.d * 1000 >= since)
    .map(a => ({title:a.t, link:a.l, source:a.s, date:new Date(a.d * 1000), kw}));
}
async function fetchNews(kw){
  const local = fromServer(kw);
  if(local) return local;
  const url = rssUrl(kw);
  const order = PROXIES.map((_, i) => (i + goodProxy) % PROXIES.length);
  for(const i of order){
    try{
      const r = await withTimeout(PROXIES[i](url), 8000);
      if(!r.ok) continue;
      const items = parseXml(await r.text(), kw);
      if(items.length){ goodProxy = i; return items; }
    }catch(e){}
  }
  return viaRss2json(kw);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(d){
  const s = (Date.now() - d.getTime())/1000;
  if(isNaN(s)) return '';
  if(s < 3600) return Math.max(1, Math.floor(s/60)) + '분 전';
  if(s < 86400) return Math.floor(s/3600) + '시간 전';
  return Math.floor(s/86400) + '일 전';
}

function renderBrief(){
  const box = $('#brief');
  if(active === '__all__'){
    const rows = list().filter(k => BRIEF[k] && BRIEF[k][0]).map(k => `<li><b>${esc(k)}</b>${esc(BRIEF[k][0])}</li>`).join('');
    box.innerHTML = rows ? `<div class="sum brief"><div class="bh"><div class="bt">📋 기업별 대표 이슈<small>기업을 누르면 이슈 3가지와 기업 설명을 볼 수 있어요</small></div></div><ul>${rows}</ul></div>` : '';
    return;
  }
  const b = BRIEF[active];
  if(!b){ box.innerHTML = ''; return; }
  const m = META[active];
  const label = m && m.summarized_at ? `자동 정리 ${m.summarized_at} · 새 소식이 없으면 유지` : `${briefDate} 기준 정리`;
  const d = DESC[active];
  box.innerHTML = `<div class="sum brief"><div class="bh">
    <div class="bt">📋 ${esc(active)} 핵심 이슈<small>${esc(label)}</small></div>
    ${d ? `<div class="bd">${esc(d)}</div>` : ''}
  </div><ul>${b.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
}

const STOP = new Set(['단독','속보','종합','오늘','내일','올해','관련','대한','위해','통해','이후','전망','분석','논란','발표','기자','영상','포토','사진','결국','이번','지난','최근','우리','이제','있다','한다','했다','된다']);
function renderSummary(items){
  const box = $('#summary');
  if(items.length < 4){ box.innerHTML = ''; return; }
  const skip = new Set(list().flatMap(k => aliasOf(k).split(/\s+OR\s+|\s+/)).filter(Boolean));
  const tok = t => [...new Set((t.match(/[가-힣A-Za-z0-9]{2,}/g) || [])
    .map(w => w.length > 2 ? w.replace(/(에서|으로|까지|부터|은|는|이|가|을|를|의|에|도|와|과|만|로)$/, '') : w)
    .filter(w => w.length >= 2 && !skip.has(w) && !STOP.has(w) && /[가-힣A-Za-z]/.test(w)))];
  let pool = items.map(a => ({a, t: tok(a.title)}));
  const topics = [];
  while(topics.length < 3){
    const df = {};
    pool.forEach(p => p.t.forEach(w => df[w] = (df[w] || 0) + 1));
    const best = Object.entries(df).filter(([, n]) => n >= 2)
      .sort((x, y) => y[1] - x[1] || y[0].length - x[0].length)[0];
    if(!best) break;
    topics.push({word: best[0], arts: pool.filter(p => p.t.includes(best[0])).map(p => p.a)});
    pool = pool.filter(p => !p.t.includes(best[0]));
  }
  if(!topics.length){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="sum"><div class="sumh">📌 최근 이슈 ${topics.length}가지<span>기사 제목 키워드 기준 자동 분류</span></div>` +
    topics.map((t, i) => `<div class="topic">
      <div class="tt">${i + 1}. ${esc(t.word)} <span class="badge2">기사 ${t.arts.length}건</span></div>
      <a class="tl" href="${esc(t.arts[0].link)}" target="_blank" rel="noopener">${esc(t.arts[0].title)}</a>
      <div class="tm">${esc(t.arts[0].source)} · ${ago(t.arts[0].date)}${t.arts.length > 1 ? ' 외 ' + (t.arts.length - 1) + '건' : ''}</div>
    </div>`).join('') + '</div>';
}

/* ───── 불러오는 중 표시 ───── */
let net = {state:'idle'}, runId = 0;
function statHtml(){
  if(net.state === 'load'){
    return `<div class="stat load"><span><span class="spin"></span>뉴스를 불러오는 중… ${net.done}/${net.total}</span>
      <small>${net.last ? esc(net.last) + ' 완료 · ' : ''}화면이 멈춘 게 아니에요. 서버가 느리면 최대 1분 정도 걸릴 수 있어요.</small></div>`;
  }
  if(net.state === 'ok') return `<div class="stat ok">✓ ${net.total}개 기업 업데이트 완료</div>`;
  if(net.state === 'bad') return `<div class="stat bad"><span>⚠ ${net.names.length}개 기업을 불러오지 못했어요</span><button id="retry">실패한 기업 다시 시도</button><small>${net.names.map(esc).join(', ')}</small></div>`;
  return '';
}
function setProgress(){
  const bar = $('#bar'), btn = $('#refresh'), fill = bar.firstElementChild;
  if(net.state === 'load'){
    bar.className = 'on' + (net.done === 0 ? ' ind' : '');
    fill.style.width = net.done === 0 ? '' : Math.max(8, net.done / net.total * 100) + '%';
    btn.disabled = true;
    btn.innerHTML = `<span class="spin"></span>불러오는 중 ${net.done}/${net.total}`;
  }else{
    bar.className = ''; fill.style.width = '0';
    btn.disabled = false; btn.textContent = '새로고침';
  }
}

function renderList(msg){
  const box = $('#list');
  $('#stat').innerHTML = statHtml();
  if(group === MY && !watch.length){
    box.innerHTML = '<div class="empty">위 입력칸에 기업이나 키워드를 넣어 추가해 보세요.<br>추가한 기업은 이 탭에 모여요.</div>';
    $('#summary').innerHTML = ''; $('#brief').innerHTML = '';
    return;
  }
  const kws = active === '__all__' ? list() : [active];
  let items = kws.flatMap(k => cache[k] || []);
  const dup = new Set();
  items = items.filter(a => dup.has(a.link) ? false : dup.add(a.link)).sort((a,b) => b.date - a.date);
  let html = '';
  if(!items.length){
    if(net.state === 'load') html += '<div class="skel"></div>'.repeat(4);
    else if(net.state === 'bad' && kws.some(k => net.names.includes(k))) html += '<div class="empty">뉴스를 불러오지 못해서 기사가 없어요.<br>위의 "실패한 기업 다시 시도" 버튼을 눌러 주세요.</div>';
    else html += '<div class="empty">표시할 기사가 없어요. 기간을 늘려 보세요.</div>';
  }
  html += items.map(a => `
    <a class="item" href="${esc(a.link)}" target="_blank" rel="noopener" data-link="${esc(a.link)}">
      <div class="t">${esc(a.title)}</div>
      <div class="m">
        <span class="co">${esc(a.kw)}</span>
        <span>${esc(a.source)}</span>
        <span>${ago(a.date)}</span>
        ${seen[a.link] ? '' : '<span class="badge">NEW</span>'}
      </div>
    </a>`).join('');
  box.innerHTML = html;
  renderBrief();
  renderSummary(items);
}
function renderAll(msg){ renderTabs(); renderChips(); renderList(msg); }

/* ───── 새로고침: 지금 보는 탭의 기업만 불러옴 ───── */
async function refresh(force, only){
  const kws = list();
  const myRun = ++runId;                       // 이전 새로고침은 여기서 중단됨
  if(!kws.length){ net = {state:'idle'}; setProgress(); renderAll(); return; }
  const per = $('#period').value;
  if(force || !ARTICLES) await loadArticles();
  if(myRun !== runId) return;
  const need = only ? only.filter(k => kws.includes(k))
    : kws.filter(k => force || !cache[k] || (Date.now() - (stamp[k + per] || 0) > 10 * 60 * 1000));
  if(!need.length){ net = {state:'idle'}; setProgress(); renderAll(); return; }

  net = {state:'load', done:0, total:need.length, last:''};
  setProgress(); renderAll();

  const prev = {};
  need.forEach(k => prev[k] = new Set((cache[k] || []).map(a => a.link)));
  const failedNames = [];
  let idx = 0;
  const worker = async () => {
    while(idx < need.length && myRun === runId){
      const k = need[idx++];
      try{ cache[k] = await fetchNews(k); stamp[k + per] = Date.now(); }catch(e){ failedNames.push(k); }
      if(myRun !== runId) return;
      net.done++; net.last = k;
      setProgress(); renderAll();              // 하나 끝날 때마다 화면 갱신
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if(myRun !== runId) return;

  const fresh = need.filter(k => prev[k].size).flatMap(k => (cache[k] || []).filter(a => !prev[k].has(a.link)));
  if(fresh.length && 'Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('새 뉴스 ' + fresh.length + '건', {body: fresh[0].title}); }catch(e){}
  }
  $('#updated').textContent = list().some(k => ARTICLES && ARTICLES[k] && !custom[k]) && ARTICLES_AT
    ? '기사 ' + ARTICLES_AT.slice(5) + ' 기준'
    : '업데이트 ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  net = failedNames.length ? {state:'bad', names:failedNames} : {state:'ok', total:need.length};
  setProgress(); renderAll();
  if(net.state === 'ok') setTimeout(() => { if(myRun === runId && net.state === 'ok'){ net = {state:'idle'}; renderList(); } }, 3500);
}

/* ───── 이벤트 ───── */
function addKw(){
  let v = $('#q').value.trim();
  if(v.includes('=')){
    const [n, ...r] = v.split('=');
    const qq = r.join('=').trim();
    v = n.trim();
    if(v && qq){ custom[v] = qq; store.set('aliases', custom); }
  }
  $('#q').value = '';
  if(!v) return;
  if(!watch.includes(v)){ watch.push(v); store.set('watch', watch); }
  group = MY; active = v;
  store.set('group', group); store.set('active', active);
  delete stamp[v + $('#period').value];
  refresh();
}
$('#add').onclick = addKw;
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter') addKw(); });
$('#refresh').onclick = () => refresh(true);
$('#period').onchange = () => { store.set('period', $('#period').value); refresh(); };
$('#notify').onclick = async () => {
  if(!('Notification' in window)) return alert('이 브라우저는 알림을 지원하지 않아요.');
  const p = await Notification.requestPermission();
  $('#notify').textContent = p === 'granted' ? '알림 켜짐' : '알림 꺼짐';
};
$('#tabs').onclick = e => {
  const t = e.target.closest('.tab');
  if(!t) return;
  group = t.dataset.g; active = '__all__';
  store.set('group', group); store.set('active', active);
  refresh();
};
$('#chips').onclick = e => {
  const del = e.target.dataset.del;
  if(del){
    watch = watch.filter(k => k !== del); delete cache[del];
    store.set('watch', watch);
    if(active === del){ active = '__all__'; store.set('active', active); }
    renderAll(); return;
  }
  const chip = e.target.closest('.chip');
  if(chip){ active = chip.dataset.k; store.set('active', active); renderChips(); renderList(); }
};
document.addEventListener('click', e => {
  if(e.target.id === 'retry') refresh(true, (net.names || []).slice());
});
$('#list').onclick = e => {
  const a = e.target.closest('.item');
  if(a){ seen[a.dataset.link] = 1; store.set('seen', seen); setTimeout(() => { renderChips(); renderList(); }, 50); }
};

if('Notification' in window && Notification.permission === 'granted') $('#notify').textContent = '알림 켜짐';
renderAll();
refresh();
setInterval(() => refresh(true), 30 * 60 * 1000);
</script>
